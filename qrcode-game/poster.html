<style>

  .qr{background:#fff;border-radius:22px;padding:16px;display:inline-block;box-shadow:0 10px 26px -14px rgba(0,0,0,.3);position:relative}
  .qr img{display:block;width:230px;height:230px;image-rendering:pixelated}
  .cta{margin-top:20px;font-family:'Fredoka';font-weight:600;font-size:1.15rem;color:var(--ink);position:relative}
  .cta .badge{display:inline-block;background:linear-gradient(180deg,#28f0b8,var(--mint));color:#063a2e;padding:10px 20px;border-radius:14px;box-shadow:0 8px 18px -8px rgba(10,165,131,.7)}
  .foot{margin-top:14px;font-size:.8rem;color:#8a9aa3;font-weight:700;position:relative}
  @media print{body{background:#fff;padding:0}.card{box-shadow:none;border:none}}
</style>
